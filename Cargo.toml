[workspace]
resolver = "2"
members = ["xcrypt-core", "xcrypt-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["xcrypt authors"]

[workspace.dependencies]
# Crypto primitives — all RustCrypto, nothing hand-rolled.
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
secrecy = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# Format / plumbing
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tempfile = "3.14"
walkdir = "2.5"
rayon = "1.10"

# CLI
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
rpassword = "7.3"
serde_json = "1.0"

# Dev
proptest = "1.5"
hex-literal = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# Argon2 and ChaCha20 are unusably slow in an unoptimized build, and the test
# suite runs a KDF per archive. Optimize dependencies even in dev/test profiles.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
